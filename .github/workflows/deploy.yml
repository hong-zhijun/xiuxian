name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    # 只在原仓库部署：通过「Deploy to Cloudflare」按钮或 fork 复制出的仓库没有这些 secret，跳过而不是报错
    if: github.repository_owner == 'hong-zhijun'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # 生产配置里的 D1 database_id 是占位符，部署时用仓库 secret 替换（开源仓库不写死任何人的数据库）
      - run: sed -i "s/__D1_DATABASE_ID__/${D1_DATABASE_ID}/" wrangler.production.jsonc
        working-directory: apps/server
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}

      - run: npx wrangler d1 migrations apply DB --remote --config wrangler.production.jsonc
        working-directory: apps/server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - run: npx wrangler deploy --config wrangler.production.jsonc
        working-directory: apps/server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
